name: XMA 0.1 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript Core and Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.17.0
      - name: Install Workspace JavaScript dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline --reporter=append-only
      - run: pnpm check
      - run: pnpm build:web
      - run: pnpm build:cli
      - run: pnpm smoke:cli
      - run: pnpm build:server

  javascript-windows-powershell51:
    name: JavaScript Runtime · Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.17.0
        shell: powershell
      - name: Prepare managed JavaScript Runtime through XMA Windows flow
        shell: powershell
        run: .\scripts\windows\xma-prepare.ps1 -Component js
      - run: pnpm check
        shell: powershell
      - run: pnpm build:cli
        shell: powershell
      - run: pnpm smoke:cli
        shell: powershell

  rust-linux:
    name: Rust Native Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace

  rust-windows:
    name: Rust Native Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
