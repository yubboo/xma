packages:
  - "apps/*"

# pnpm 11 默认阻止依赖包执行 install/postinstall 脚本。
# XMA 通用环境只需要 esbuild 的 Native Binary；Electron Runtime 由 XMA Desktop 安装器显式按需处理，
# 因此 electron 不进入 allowBuilds，防止任何普通 pnpm install 意外下载 Chromium。
allowBuilds:
  esbuild: true

# pnpm 11 的 workspace 级依赖覆盖必须写在这里，而不是 package.json -> pnpm.overrides。
# 当前用于保证 Electron Builder / 非 Windows ZIP 链使用新版 yauzl。
overrides:
  yauzl: "^3.3.1"
